services:
  - type: web
    name: corrix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: ERO_SMTP_HOST
        sync: false
      - key: ERO_SMTP_PORT
        sync: false
      - key: ERO_SMTP_USERNAME
        sync: false
      - key: ERO_SMTP_PASSWORD
        sync: false
      - key: ERO_ALERT_FROM_EMAIL
        sync: false
      - key: ERO_ALERT_TO_EMAIL
        sync: false
      - key: ERO_SLACK_WEBHOOK_URL
        sync: false
      - key: ERO_DISCORD_WEBHOOK_URL
        sync: false
